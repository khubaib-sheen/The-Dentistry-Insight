<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — The Dentistry Insight</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#f8fafc;min-height:100vh;}
  .topbar{background:#0c2340;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;}
  .topbar img{height:36px;width:auto;object-fit:contain;}
  .topbar a.home{color:#fff;font-size:.8rem;font-weight:700;text-decoration:none;opacity:.85;}
  .wrap{max-width:520px;margin:3rem auto;padding:0 1rem;}
  .card{background:#fff;border-radius:1rem;box-shadow:0 20px 25px -5px rgba(0,0,0,.06);border:1px solid #e2e8f0;padding:2.25rem;text-align:center;}
  .avatar{width:56px;height:56px;border-radius:50%;background:#f0f7ff;color:#0056b3;display:flex;align-items:center;justify-content:center;font-size:1.25rem;margin:0 auto 1rem;}
  h1{font-size:1.125rem;font-weight:900;color:#0f172a;}
  p.email{font-size:.8rem;color:#64748b;margin-top:.375rem;}
  button.logout{margin-top:2rem;padding:.7rem 1.5rem;background:#fff1f2;color:#e11d48;border:none;border-radius:.5rem;font-size:.8rem;font-weight:700;cursor:pointer;}
  button.logout:hover{background:#ffe4e6;}
  #loadingState{text-align:center;padding:4rem 1rem;color:#94a3b8;font-size:.8rem;}
</style>
</head>
<body>
  <div class="topbar">
    <img src="/logo.png" alt="The Dentistry Insight" onerror="this.style.display='none'">
    <a href="/" class="home"><i class="fa-solid fa-arrow-left"></i> Back to site</a>
  </div>

  <div class="wrap">
    <div id="loadingState">Loading your account…</div>
    <div id="card" class="card" style="display:none;">
      <div class="avatar"><i class="fa-solid fa-user"></i></div>
      <h1>You're logged in</h1>
      <p class="email" id="emailDisplay"></p>
      <button class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>&nbsp; Log out</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://rtzxxeeqfhmmnoubwzvq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_v8RouLqDckbyAXURXFo18w_Q0M3Qx5-";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    document.getElementById('loadingState').style.display = 'none';
    if (!session) {
      window.location.href = '/login.html';
      return;
    }
    document.getElementById('emailDisplay').textContent = session.user.email;
    document.getElementById('card').style.display = 'block';
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/';
  });
</script>
</body>
</html>
